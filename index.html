
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUX — Control the Force</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #080d18;
    --panel: #101a2a;
    --cyan: #43e7ff;
    --orange: #ff9b54;
    --text: #eaf5ff;
    --muted: #8294aa;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 50% -20%, #172e49 0%, transparent 55%),
        var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: min(1100px, 100%);
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 39px;
    height: 39px;
    border: 2px solid var(--cyan);
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: var(--cyan);
    font-size: 21px;
    box-shadow: 0 0 18px #43e7ff35;
}

.brand-name {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 3px;
    font-size: 23px;
    font-weight: 800;
}

.brand-sub {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 3px;
}

.stats {
    display: flex;
    gap: 9px;
}

.stat {
    background: #111d2d;
    border: 1px solid #26394e;
    border-radius: 10px;
    padding: 9px 15px;
    min-width: 90px;
}

.stat small {
    display: block;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
}

.stat strong {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
}

.game-frame {
    position: relative;
    width: 100%;
    border: 1px solid #28435a;
    border-radius: 17px;
    overflow: hidden;
    background: #0c1726;
    box-shadow: 0 20px 70px #0008, 0 0 35px #43e7ff0b;
}

canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    touch-action: none;
}

.screen-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: #07101de8;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
}

.screen-overlay.hidden {
    display: none;
}

.screen-content {
    width: min(520px, 100%);
    animation: appear .35s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
    color: var(--cyan);
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 17px;
}

.hero-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(55px, 10vw, 92px);
    line-height: 1;
    letter-spacing: 8px;
    font-weight: 800;
    text-shadow: 0 0 35px #43e7ff48;
}

.hero-title span {
    color: var(--cyan);
}

.hero-subtitle {
    color: var(--orange);
    letter-spacing: 5px;
    font-size: 12px;
    font-weight: 700;
    margin: 13px 0 22px;
}

.description {
    color: #a7b8ca;
    font-size: 14px;
    line-height: 1.8;
    max-width: 410px;
    margin: 0 auto 27px;
}

.primary-btn,
.secondary-btn {
    border: 0;
    padding: 13px 24px;
    border-radius: 9px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    letter-spacing: 1px;
    font-size: 11px;
    transition: .2s;
}

.primary-btn {
    color: #04121b;
    background: var(--cyan);
    box-shadow: 0 0 25px #43e7ff33;
}

.primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px #43e7ff70;
}

.secondary-btn {
    color: var(--text);
    background: #1c2c40;
    border: 1px solid #38536c;
}

.secondary-btn:hover {
    background: #263d55;
}

.button-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.instructions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 22px 0;
    text-align: left;
}

.instruction-card {
    background: #122135;
    border: 1px solid #2b4157;
    border-radius: 10px;
    padding: 13px;
}

.instruction-card .symbol {
    font-size: 22px;
    margin-bottom: 9px;
}

.instruction-card b {
    display: block;
    font-size: 11px;
    margin-bottom: 5px;
}

.instruction-card p {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
}

.overlay-score {
    font-family: 'Orbitron', sans-serif;
    color: var(--cyan);
    font-size: 30px;
    margin: 16px 0;
}

.bottom-bar {
    margin-top: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.hint {
    color: #91a6ba;
    font-size: 11px;
    line-height: 1.6;
}

.hint b {
    color: var(--cyan);
}

.controls {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.control-btn {
    border: 1px solid #2b4055;
    background: #111c2b;
    color: #dceafa;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    transition: .2s;
}

.control-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
}

.control-btn.active {
    background: #12323b;
    border-color: var(--cyan);
    color: var(--cyan);
}

.control-btn.repel {
    background: #38251c;
    border-color: var(--orange);
    color: var(--orange);
}

.mobile-note {
    display: none;
    color: var(--muted);
    font-size: 10px;
    margin-top: 8px;
}

@media (max-width: 650px) {
    body { padding: 10px; }
    .brand-name { font-size: 19px; }
    .stat { min-width: 70px; padding: 8px; }
    .stat strong { font-size: 12px; }
    .instructions { grid-template-columns: 1fr; }
    .instruction-card { display: flex; gap: 12px; align-items: center; }
    .instruction-card .symbol { margin: 0; }
    .bottom-bar { align-items: flex-start; }
    .mobile-note { display: block; }
}
</style>
</head>

<body>
<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">✧</div>
            <div>
                <div class="brand-name">FLUX</div>
                <div class="brand-sub">MAGNETIC PUZZLE SYSTEM</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <small>LEVEL</small>
                <strong id="levelDisplay">01 / 05</strong>
            </div>
            <div class="stat">
                <small>TIME</small>
                <strong id="timeDisplay">60</strong>
            </div>
            <div class="stat">
                <small>SCORE</small>
                <strong id="scoreDisplay">0000</strong>
            </div>
        </div>
    </header>

    <main>
        <div class="game-frame">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div class="screen-overlay" id="overlay"></div>
        </div>

        <div class="bottom-bar">
            <div>
                <div class="hint" id="hintDisplay">
                    <b>OBJECTIVE:</b> Guide the metal core into the portal.
                </div>
                <div class="mobile-note">
                    Touch and drag inside the arena to move the magnetic field.
                </div>
            </div>

            <div class="controls">
                <button class="control-btn active" id="polarityButton"
                        data-action="polarity">✦ ATTRACT</button>
                <button class="control-btn" data-action="restart">↻ RESTART</button>
                <button class="control-btn" data-action="pause">Ⅱ PAUSE</button>
                <button class="control-btn" id="soundButton"
                        data-action="sound">♫ SOUND ON</button>
            </div>
        </div>
    </main>
</div>

<script>
// =====================================================
// FLUX - CONTROL THE FORCE
// All game logic is contained in this JavaScript section.
// =====================================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

const W = 960;
const H = 540;
const FLOOR = 490;

const levels = [
    {
        name: "First Contact",
        description: "Your first magnetic experiment.",
        hint: "Move the field ahead of the core to pull it towards the portal.",
        obstacles: []
    },
    {
        name: "Opposite Reaction",
        description: "A barrier blocks your path.",
        hint: "Use magnetic force to lift the core over the barrier.",
        obstacles: [
            { x: 430, y: 380, w: 52, h: 110 }
        ]
    },
    {
        name: "Momentum",
        description: "Two obstacles. One magnetic core.",
        hint: "Switch between attraction and repulsion to control movement.",
        obstacles: [
            { x: 310, y: 417, w: 58, h: 73 },
            { x: 590, y: 360, w: 60, h: 130 }
        ]
    },
    {
        name: "Heavy Metal",
        description: "Navigate a more complicated arena.",
        hint: "Build momentum before guiding the core over each block.",
        obstacles: [
            { x: 370, y: 390, w: 55, h: 100 },
            { x: 600, y: 416, w: 60, h: 74 },
            { x: 465, y: 295, w: 130, h: 18 }
        ]
    },
    {
        name: "Chain Reaction",
        description: "The final magnetic experiment.",
        hint: "Plan your field position carefully. Reach the portal!",
        obstacles: [
            { x: 285, y: 412, w: 55, h: 78 },
            { x: 485, y: 365, w: 60, h: 125 },
            { x: 690, y: 410, w: 55, h: 80 }
        ]
    }
];

const game = {
    state: "menu",
    level: 0,
    score: 0,
    levelTime: 60,
    polarity: 1,       // 1 = attract, -1 = repel
    sound: true,
    magnet: { x: 250, y: 250 },
    ball: { x: 105, y: FLOOR - 14, vx: 0, vy: 0, r: 14 },
    trail: [],
    particles: [],
    stars: [],
    lastTime: 0,
    audio: null,
    collisionCooldown: 0
};

const GRAVITY = 680;
const MAGNET_RANGE = 270;
const MAGNET_STRENGTH = 1250;
const MAX_SPEED = 520;
const START_TIME = 60;

// Create background stars.
for (let i = 0; i < 75; i++) {
    game.stars.push({
        x: Math.random() * W,
        y: Math.random() * 480,
        r: Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.5 + 0.15
    });
}

// High resolution canvas support.
function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// -----------------------------------------------------
// AUDIO
// Small sounds are generated with Web Audio.
// No external sound files are required.
// -----------------------------------------------------

function playTone(frequency = 440, duration = 0.12, type = "sine") {
    if (!game.sound) return;

    try {
        if (!game.audio) {
            game.audio = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (game.audio.state === "suspended") {
            game.audio.resume();
        }

        const oscillator = game.audio.createOscillator();
        const gain = game.audio.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, game.audio.currentTime);

        gain.gain.setValueAtTime(0.07, game.audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            game.audio.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(game.audio.destination);

        oscillator.start();
        oscillator.stop(game.audio.currentTime + duration);
    } catch (error) {
        console.warn("Audio is not available:", error);
    }
}

// -----------------------------------------------------
// GAME SCREENS
// -----------------------------------------------------

function showOverlay(title, subtitle, buttons, extra = "") {
    overlay.classList.remove("hidden");

    overlay.innerHTML = `
        <div class="screen-content">
            <div class="eyebrow">FLUX // MAGNETIC EXPERIMENT</div>
            <h2 style="font-family:Orbitron,sans-serif;font-size:30px;letter-spacing:2px">
                ${title}
            </h2>
            <p class="description">${subtitle}</p>
            ${extra}
            <div class="button-row">
                ${buttons}
            </div>
        </div>
    `;
}

function hideOverlay() {
    overlay.classList.add("hidden");
}

function showMainMenu() {
    game.state = "menu";

    showOverlay(
        '<span style="font-size:67px">FL<span style="color:#43e7ff">U</span>X</span>',
        "Control the force. Master the field. Guide the core.",
        `
            <button class="primary-btn" data-action="start">▶ START GAME</button>
            <button class="secondary-btn" data-action="help">HOW TO PLAY</button>
        `,
        `<div class="eyebrow" style="margin-top:15px;color:#8fa7bd">
            FIVE LEVELS · MAGNETIC PHYSICS · ONE CORE
        </div>`
    );
}

function showInstructions() {
    game.state = "help";

    showOverlay(
        "HOW TO PLAY",
        "You control a magnetic field. Use it to move the metal core into the exit portal.",
        `
            <button class="primary-btn" data-action="start">LET'S PLAY</button>
            <button class="secondary-btn" data-action="menu">BACK</button>
        `,
        `
        <div class="instructions">
            <div class="instruction-card">
                <div class="symbol">🖱️</div>
                <div>
                    <b>MOVE FIELD</b>
                    <p>Move your mouse or finger inside the arena.</p>
                </div>
            </div>
            <div class="instruction-card">
                <div class="symbol" style="color:#43e7ff">✦</div>
                <div>
                    <b>ATTRACT</b>
                    <p>Pull the core towards your magnetic field.</p>
                </div>
            </div>
            <div class="instruction-card">
                <div class="symbol" style="color:#ff9b54">✧</div>
                <div>
                    <b>REPEL</b>
                    <p>Push the core away from your field.</p>
                </div>
            </div>
        </div>
        <p style="font-size:11px;color:#8294aa;line-height:1.8">
            SPACE = Change polarity &nbsp; R = Restart &nbsp; ESC = Pause
        </p>
        `
    );
}

function startGame() {
    game.level = 0;
    game.score = 0;
    startLevel();
}

function startLevel() {
    game.state = "playing";
    game.levelTime = START_TIME;
    game.polarity = 1;

    game.ball = {
        x: 105,
        y: FLOOR - 14,
        vx: 0,
        vy: 0,
        r: 14
    };

    game.magnet = { x: 260, y: 260 };
    game.trail = [];
    game.particles = [];
    game.collisionCooldown = 0;

    hideOverlay();
    updateHUD();
    updatePolarityButton();
}

function completeLevel() {
    if (game.state !== "playing") return;

    game.state = "complete";

    const bonus = Math.floor(game.levelTime * 10);
    const earned = 1000 + bonus;
    game.score += earned;

    playTone(660, 0.15);
    setTimeout(() => playTone(880, 0.2), 130);

    const isLast = game.level === levels.length - 1;

    showOverlay(
        "LEVEL COMPLETE",
        isLast
            ? "You have mastered the magnetic field."
            : levels[game.level].name + " successfully completed.",
        isLast
            ? `<button class="primary-btn" data-action="victory">VIEW RESULTS →</button>`
            : `<button class="primary-btn" data-action="next">NEXT LEVEL →</button>`,
        `
            <div class="overlay-score">+${earned}</div>
            <p style="font-size:11px;color:#8294aa">TIME BONUS INCLUDED</p>
        `
    );
    updateHUD();
}

function showVictory() {
    game.state = "victory";

    showOverlay(
        "EXPERIMENT COMPLETE",
        "All five magnetic challenges have been completed. You are now a master of FLUX.",
        `
            <button class="primary-btn" data-action="start">PLAY AGAIN</button>
            <button class="secondary-btn" data-action="menu">MAIN MENU</button>
        `,
        `<div class="overlay-score">${game.score.toLocaleString("en-IN")}</div>
         <p style="font-size:11px;color:#8294aa">FINAL SCORE</p>`
    );
}

function failLevel() {
    game.state = "failed";
    playTone(160, 0.35, "sawtooth");

    showOverlay(
        "FIELD COLLAPSED",
        "Time ran out before the core reached the portal. Try a different magnetic strategy.",
        `
            <button class="primary-btn" data-action="restart">↻ TRY AGAIN</button>
            <button class="secondary-btn" data-action="menu">MAIN MENU</button>
        `
    );
}

function pauseGame() {
    if (game.state === "playing") {
        game.state = "paused";

        showOverlay(
            "PAUSED",
            "Your experiment is on hold.",
            `
                <button class="primary-btn" data-action="resume">RESUME</button>
                <button class="secondary-btn" data-action="restart">RESTART LEVEL</button>
                <button class="secondary-btn" data-action="menu">MAIN MENU</button>
            `
        );
    } else if (game.state === "paused") {
        game.state = "playing";
        hideOverlay();
    }
}

// -----------------------------------------------------
// BUTTON ACTIONS
// -----------------------------------------------------

document.addEventListener("click", function(event) {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;

    switch (action) {
        case "start":
            startGame();
            break;

        case "help":
            showInstructions();
            break;

        case "menu":
            showMainMenu();
            break;

        case "next":
            game.level++;
            startLevel();
            break;

        case "victory":
            showVictory();
            break;

        case "resume":
            game.state = "playing";
            hideOverlay();
            break;

        case "restart":
            if (game.state === "menu" || game.state === "help") {
                return;
            }
            startLevel();
            break;

        case "pause":
            pauseGame();
            break;

        case "polarity":
            togglePolarity();
            break;

        case "sound":
            game.sound = !game.sound;
            updateSoundButton();
            if (game.sound) playTone(520, 0.1);
            break;
    }
});

function togglePolarity() {
    if (game.state !== "playing") return;

    game.polarity *= -1;
    updatePolarityButton();

    spawnParticles(game.magnet.x, game.magnet.y, 12);
    playTone(game.polarity === 1 ? 540 : 300, 0.1);
}

function updatePolarityButton() {
    const button = document.getElementById("polarityButton");

    if (game.polarity === 1) {
        button.textContent = "✦ ATTRACT";
        button.className = "control-btn active";
    } else {
        button.textContent = "✧ REPEL";
        button.className = "control-btn repel";
    }
}

function updateSoundButton() {
    document.getElementById("soundButton").textContent =
        game.sound ? "♫ SOUND ON" : "♫ SOUND OFF";
}

// -----------------------------------------------------
// MOUSE AND TOUCH CONTROLS
// -----------------------------------------------------

function moveMagnet(event) {
    const rect = canvas.getBoundingClientRect();

    game.magnet.x = Math.max(
        24,
        Math.min(W - 24, (event.clientX - rect.left) * W / rect.width)
    );

    game.magnet.y = Math.max(
        30,
        Math.min(H - 35, (event.clientY - rect.top) * H / rect.height)
    );
}

canvas.addEventListener("pointermove", moveMagnet);

canvas.addEventListener("pointerdown", function(event) {
    moveMagnet(event);
    if (canvas.setPointerCapture) {
        canvas.setPointerCapture(event.pointerId);
    }
});

// Keyboard controls.
document.addEventListener("keydown", function(event) {
    if (event.code === "Space") {
        event.preventDefault();
        if (!event.repeat) togglePolarity();
    }

    if (event.key.toLowerCase() === "r") {
        if (game.state !== "menu" && game.state !== "help") {
            startLevel();
        }
    }

    if (event.key === "Escape") {
        pauseGame();
    }
});

// -----------------------------------------------------
// PARTICLES
// -----------------------------------------------------

function spawnParticles(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 150 + 40;

        game.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.5,
            maxLife: 1,
            size: Math.random() * 3 + 1
        });
    }
}

function updateParticles(dt) {
    for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life -= dt;

        if (p.life <= 0) {
            game.particles.splice(i, 1);
        }
    }
}

// -----------------------------------------------------
// PHYSICS
// -----------------------------------------------------

function collideCircleRect(ball, rect) {
    const closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    const closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));

    let dx = ball.x - closestX;
    let dy = ball.y - closestY;
    let distance = Math.sqrt(dx * dx + dy * dy);

    if (distance >= ball.r) return false;

    let nx, ny;

    if (distance < 0.0001) {
        // The centre is inside the rectangle.
        const left = Math.abs(ball.x - rect.x);
        const right = Math.abs(rect.x + rect.w - ball.x);
        const top = Math.abs(ball.y - rect.y);
        const bottom = Math.abs(rect.y + rect.h - ball.y);
        const nearest = Math.min(left, right, top, bottom);

        if (nearest === left) {
            nx = -1; ny = 0;
            distance = left;
        } else if (nearest === right) {
            nx = 1; ny = 0;
            distance = right;
        } else if (nearest === top) {
            nx = 0; ny = -1;
            distance = top;
        } else {
            nx = 0; ny = 1;
            distance = bottom;
        }
    } else {
        nx = dx / distance;
        ny = dy / distance;
    }

    // Push the core outside the obstacle.
    const overlap = ball.r - distance;
    ball.x += nx * (overlap + 0.2);
    ball.y += ny * (overlap + 0.2);

    // Bounce only when moving into the obstacle.
    const velocityAlongNormal = ball.vx * nx + ball.vy * ny;

    if (velocityAlongNormal < 0) {
        const bounce = 1.35;
        ball.vx -= bounce * velocityAlongNormal * nx;
        ball.vy -= bounce * velocityAlongNormal * ny;
    }

    return true;
}

function updatePhysics(dt) {
    const ball = game.ball;
    const magnet = game.magnet;

    // Calculate direction from the core to the magnet.
    let dx = magnet.x - ball.x;
    let dy = magnet.y - ball.y;

    let distance = Math.sqrt(dx * dx + dy * dy);
    let ax = 0;
    let ay = GRAVITY;

    // Magnetic force becomes weaker with distance.
    if (distance < MAGNET_RANGE && distance > 1) {
        const directionX = dx / distance;
        const directionY = dy / distance;

        const falloff = 1 - distance / MAGNET_RANGE;
        const force = MAGNET_STRENGTH * falloff * falloff;

        ax += directionX * force * game.polarity;
        ay += directionY * force * game.polarity;
    }

    // Substeps help prevent the core from passing through obstacles.
    const steps = 2;
    const step = dt / steps;

    for (let i = 0; i < steps; i++) {
        ball.vx += ax * step;
        ball.vy += ay * step;

        // Limit maximum speed.
        const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);

        if (speed > MAX_SPEED) {
            ball.vx = (ball.vx / speed) * MAX_SPEED;
            ball.vy = (ball.vy / speed) * MAX_SPEED;
        }

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        // Left and right boundaries.
        if (ball.x - ball.r < 32) {
            ball.x = 32 + ball.r;
            ball.vx = Math.abs(ball.vx) * 0.55;
        }

        if (ball.x + ball.r > W - 32) {
            ball.x = W - 32 - ball.r;
            ball.vx = -Math.abs(ball.vx) * 0.55;
        }

        // Ceiling.
        if (ball.y - ball.r < 35) {
            ball.y = 35 + ball.r;
            ball.vy = Math.abs(ball.vy) * 0.45;
        }

        // Floor.
        if (ball.y + ball.r > FLOOR) {
            ball.y = FLOOR - ball.r;

            if (ball.vy > 0) {
                ball.vy = -ball.vy * 0.25;
            }

            if (Math.abs(ball.vy) < 25) {
                ball.vy = 0;
            }

            ball.vx *= Math.pow(0.78, step);
        }

        // Collide with the current level's obstacles.
        const obstacles = levels[game.level].obstacles;

        for (const rect of obstacles) {
            const hit = collideCircleRect(ball, rect);

            if (hit && game.collisionCooldown <= 0) {
                playTone(180, 0.045, "triangle");
                game.collisionCooldown = 0.12;
            }
        }
    }

    game.collisionCooldown -= dt;

    // Air resistance.
    ball.vx *= Math.pow(0.995, dt * 60);
    ball.vy *= Math.pow(0.999, dt * 60);

    // Leave a trail behind the moving core.
    game.trail.push({ x: ball.x, y: ball.y });

    if (game.trail.length > 15) {
        game.trail.shift();
    }

    // Check whether the core reached the portal.
    const portalX = 865;
    const portalY = 425;
    const portalDistance = Math.hypot(
        ball.x - portalX,
        ball.y - portalY
    );

    if (portalDistance < 33) {
        completeLevel();
    }
}

// -----------------------------------------------------
// DRAWING FUNCTIONS
// -----------------------------------------------------

function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#0c192a");
    gradient.addColorStop(1, "#080f1c");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Background stars.
    for (const star of game.stars) {
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#bceaff";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Grid lines.
    ctx.strokeStyle = "#29425a30";
    ctx.lineWidth = 1;

    for (let x = 40; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 30);
        ctx.lineTo(x, FLOOR);
        ctx.stroke();
    }

    for (let y = 50; y < FLOOR; y += 40) {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(W - 30, y);
        ctx.stroke();
    }

    // Arena floor.
    const floorGradient = ctx.createLinearGradient(0, FLOOR, 0, H);
    floorGradient.addColorStop(0, "#20354a");
    floorGradient.addColorStop(1, "#101a29");

    ctx.fillStyle = floorGradient;
    ctx.fillRect(30, FLOOR, W - 60, H - FLOOR);

    ctx.strokeStyle = "#43e7ff65";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, FLOOR);
    ctx.lineTo(W - 30, FLOOR);
    ctx.stroke();

    // Outer arena boundaries.
    ctx.strokeStyle = "#28445b";
    ctx.lineWidth = 2;
    ctx.strokeRect(30, 35, W - 60, FLOOR - 35);
}

function drawObstacles() {
    const obstacles = levels[game.level]
        ? levels[game.level].obstacles
        : [];

    for (const rect of obstacles) {
        ctx.save();

        // Outer glow.
        ctx.shadowColor = "#ff9b54";
        ctx.shadowBlur = 13;

        const gradient = ctx.createLinearGradient(
            rect.x, rect.y, rect.x + rect.w, rect.y + rect.h
        );

        gradient.addColorStop(0, "#334a5c");
        gradient.addColorStop(1, "#172738");

        roundedRect(rect.x, rect.y, rect.w, rect.h, 5);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffad6a";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Small detail lines.
        ctx.strokeStyle = "#ffffff1c";
        ctx.lineWidth = 1;

        for (let y = rect.y + 14; y < rect.y + rect.h; y += 16) {
            ctx.beginPath();
            ctx.moveTo(rect.x + 7, y);
            ctx.lineTo(rect.x + rect.w - 7, y);
            ctx.stroke();
        }

        ctx.restore();
    }
}

function drawPortal(time) {
    const x = 865;
    const y = 425;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(time * 0.001);

    ctx.shadowColor = "#43e7ff";
    ctx.shadowBlur = 30;

    ctx.strokeStyle = "#43e7ff";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, 31, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 10;
    ctx.strokeStyle = "#bbf8ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.stroke();

    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 23);
    glow.addColorStop(0, "#a9faff");
    glow.addColorStop(0.5, "#2387b6");
    glow.addColorStop(1, "#0a1e35");

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 19, 0, Math.PI * 2);
    ctx.fill();

    // Rotating portal marks.
    ctx.strokeStyle = "#ffffffaa";
    ctx.lineWidth = 2;

    for (let i = 0; i < 3; i++) {
        ctx.rotate(Math.PI * 2 / 3);
        ctx.beginPath();
        ctx.moveTo(0, -35);
        ctx.lineTo(0, -40);
        ctx.stroke();
    }

    ctx.restore();

    ctx.fillStyle = "#9defff";
    ctx.font = "bold 10px Inter";
    ctx.textAlign = "center";
    ctx.fillText("EXIT", x, y + 53);
}

function drawBall() {
    const ball = game.ball;

    // Motion trail.
    for (let i = 0; i < game.trail.length; i++) {
        const p = game.trail[i];
        const alpha = (i + 1) / game.trail.length * 0.23;

        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#75ebff";
        ctx.beginPath();
        ctx.arc(
            p.x, p.y,
            ball.r * (i + 1) / game.trail.length * 0.7,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Core glow.
    ctx.save();
    ctx.shadowColor = "#43e7ff";
    ctx.shadowBlur = 25;

    const gradient = ctx.createRadialGradient(
        ball.x - 5, ball.y - 6, 2,
        ball.x, ball.y, ball.r + 4
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.25, "#a9f6ff");
    gradient.addColorStop(0.65, "#4cbad6");
    gradient.addColorStop(1, "#16486d");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#b7fbff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Highlight.
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffffaa";
    ctx.beginPath();
    ctx.arc(ball.x - 5, ball.y - 6, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawMagnet() {
    const m = game.magnet;
    const isAttract = game.polarity === 1;
    const color = isAttract ? "#43e7ff" : "#ff9b54";

    ctx.save();
    ctx.translate(m.x, m.y);

    // Magnetic field rings.
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;

    for (let radius = 28; radius <= 70; radius += 21) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.globalAlpha = 1;

    ctx.shadowColor = color;
    ctx.shadowBlur = 22;

    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#0d1c2a";
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.font = "bold 16px Inter";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(isAttract ? "+" : "−", 0, 1);

    ctx.fillStyle = color;
    ctx.font = "bold 9px Inter";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(isAttract ? "PULL" : "PUSH", 0, 36);

    ctx.restore();
}

function drawParticles() {
    for (const p of game.particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = "#8df4ff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

function drawLevelLabel() {
    const level = levels[game.level];

    ctx.textAlign = "left";
    ctx.fillStyle = "#43e7ff";
    ctx.font = "bold 10px Inter";
    ctx.fillText(`EXPERIMENT 0${game.level + 1}`, 47, 58);

    ctx.fillStyle = "#dceafa";
    ctx.font = "bold 17px Orbitron";
    ctx.fillText(level.name.toUpperCase(), 47, 82);
}

function render(time) {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    if (game.level < levels.length) {
        drawPortal(time);
        drawObstacles();
        drawLevelLabel();
        drawBall();
        drawMagnet();
        drawParticles();
    }
}

// -----------------------------------------------------
// HUD
// -----------------------------------------------------

function updateHUD() {
    document.getElementById("levelDisplay").textContent =
        String(game.level + 1).padStart(2, "0") + " / 05";

    document.getElementById("timeDisplay").textContent =
        Math.max(0, Math.ceil(game.levelTime));

    document.getElementById("scoreDisplay").textContent =
        String(game.score).padStart(4, "0");

    document.getElementById("hintDisplay").innerHTML =
        `<b>${levels[game.level].name.toUpperCase()}:</b> ${levels[game.level].hint}`;
}

// -----------------------------------------------------
// MAIN GAME LOOP
// requestAnimationFrame repeatedly updates and draws.
// -----------------------------------------------------

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - game.lastTime) / 1000 || 0, 0.032);
    game.lastTime = timestamp;

    if (game.state === "playing") {
        game.levelTime -= dt;

        if (game.levelTime <= 0) {
            game.levelTime = 0;
            failLevel();
        } else {
            updatePhysics(dt);
            updateParticles(dt);
        }

        updateHUD();
    } else if (game.state !== "paused") {
        updateParticles(dt);
    }

    render(timestamp);
    requestAnimationFrame(gameLoop);
}

// Start the application.
updateHUD();
updatePolarityButton();
updateSoundButton();
showMainMenu();
requestAnimationFrame(gameLoop);

</script>
