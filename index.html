
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUX — Limitless Blue</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #07101c;
    --panel: #101d30;
    --cyan: #55dfff;
    --blue: #168bff;
    --text: #eaf6ff;
    --muted: #8ca2bb;
    --border: #263d58;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background:
        radial-gradient(ellipse at 50% -25%, #173b62 0%, transparent 60%),
        var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app { width: min(1120px, 100%); }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 18px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border: 2px solid var(--cyan);
    border-radius: 13px;
    color: var(--cyan);
    font-size: 25px;
    box-shadow: 0 0 22px #55dfff35;
}

.logo h1 {
    margin: 0;
    font-family: Orbitron, sans-serif;
    font-size: 23px;
    letter-spacing: 4px;
}

.logo p {
    margin: 4px 0 0;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
}

.stats {
    display: flex;
    gap: 8px;
}

.stat {
    background: #101d2d;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    min-width: 82px;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 1.3px;
    margin-bottom: 4px;
}

.stat strong {
    font-family: Orbitron, sans-serif;
    font-size: 14px;
}

.frame {
    width: 100%;
    position: relative;
    border: 1px solid #315271;
    border-radius: 17px;
    overflow: hidden;
    background: #091726;
    box-shadow: 0 22px 65px #0009, 0 0 35px #168bff12;
}

canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    touch-action: none;
}

.overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
    text-align: center;
    background: #07101de9;
    backdrop-filter: blur(8px);
}

.overlay.hidden { display: none; }

.screen {
    width: min(520px, 100%);
    animation: appear .3s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
    color: var(--cyan);
    letter-spacing: 3px;
    font-weight: 800;
    font-size: 10px;
    margin-bottom: 15px;
}

.hero {
    font-family: Orbitron, sans-serif;
    font-size: clamp(52px, 10vw, 88px);
    font-weight: 800;
    letter-spacing: 8px;
    line-height: 1;
    text-shadow: 0 0 35px #168bff70;
}

.hero span { color: var(--cyan); }

.subtitle {
    color: #78caff;
    letter-spacing: 4px;
    font-size: 11px;
    font-weight: 800;
    margin: 13px 0 20px;
}

.description {
    color: #afc2d7;
    font-size: 13px;
    line-height: 1.8;
    max-width: 420px;
    margin: 0 auto 24px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.primary, .secondary {
    padding: 12px 22px;
    border-radius: 9px;
    border: 0;
    cursor: pointer;
    font-family: Inter, sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    transition: .2s;
}

.primary {
    color: #031321;
    background: var(--cyan);
    box-shadow: 0 0 24px #55dfff40;
}

.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 32px #55dfff80;
}

.secondary {
    color: var(--text);
    background: #1a2c43;
    border: 1px solid #385473;
}

.secondary:hover { background: #263e5b; }

.instructions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin: 20px 0;
    text-align: left;
}

.instruction {
    padding: 13px;
    background: #13263d;
    border: 1px solid #29445f;
    border-radius: 10px;
}

.instruction b {
    display: block;
    font-size: 11px;
    margin-bottom: 6px;
}

.instruction p {
    margin: 0;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
}

.symbol {
    font-size: 21px;
    color: var(--cyan);
    margin-bottom: 7px;
}

.score-result {
    color: var(--cyan);
    font-family: Orbitron, sans-serif;
    font-size: 32px;
    margin: 15px 0;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 13px;
}

.hint {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

.hint b { color: var(--cyan); }

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.control {
    background: #111e30;
    border: 1px solid #30465f;
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
}

.control:hover {
    border-color: var(--cyan);
    color: var(--cyan);
}

.control.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: #123449;
}

.mobile-note {
    display: none;
    color: var(--muted);
    font-size: 10px;
    margin-top: 7px;
}

@media(max-width:650px) {
    body { padding: 10px; }
    .logo h1 { font-size: 19px; }
    .stat { min-width: 64px; padding: 8px; }
    .stat strong { font-size: 11px; }
    .instructions { grid-template-columns: 1fr; }
    .instruction { display: flex; gap: 12px; align-items: center; }
    .instruction .symbol { margin: 0; }
    .mobile-note { display: block; }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
    <div class="logo">
        <div class="logo-icon">✧</div>
        <div>
            <h1>FLUX</h1>
            <p>LIMITLESS BLUE // MAGNETIC PUZZLE</p>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <span>LEVEL</span>
            <strong id="level">01</strong>
        </div>
        <div class="stat">
            <span>TIME</span>
            <strong id="time">75</strong>
        </div>
        <div class="stat">
            <span>SCORE</span>
            <strong id="score">0000</strong>
        </div>
        <div class="stat">
            <span>BEST</span>
            <strong id="best">0000</strong>
        </div>
    </div>
</header>

<div class="frame">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="overlay" id="overlay"></div>
</div>

<div class="toolbar">
    <div>
        <div class="hint" id="hint">
            <b>MISSION:</b> Guide the energy core into the portal.
        </div>
        <div class="mobile-note">
            Touch and drag to move the blue magnetic field.
        </div>
    </div>

    <div class="controls">
        <button class="control active" id="polarityButton"
                data-action="polarity">✦ BLUE PULL</button>
        <button class="control" data-action="restart">↻ RESTART</button>
        <button class="control" data-action="pause">Ⅱ PAUSE</button>
        <button class="control" id="soundButton"
                data-action="sound">♫ SOUND ON</button>
    </div>
</div>

</div>

<script>
// ====================================================
// FLUX: LIMITLESS BLUE
// Single-file HTML5 Canvas game.
// ====================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

const W = 960;
const H = 540;
const FLOOR = 490;

const PORTAL = { x: 875, y: 426 };

const game = {
    state: "menu",
    level: 1,
    score: 0,
    best: 0,
    timer: 75,
    polarity: 1,
    sound: true,
    pointer: { x: 220, y: 260 },
    ball: { x: 90, y: FLOOR - 14, vx: 0, vy: 0, r: 14 },
    obstacles: [],
    particles: [],
    trail: [],
    elapsed: 0,
    lastFrame: 0,
    collisionCooldown: 0
};

// Best score is saved in the browser.
try {
    game.best = Number(localStorage.getItem("fluxBest") || 0);
} catch (e) {
    game.best = 0;
}

// Gojo asset.
// Save the downloaded chibi image as assets/gojo-chibi.png.
const gojo = new Image();
gojo.src = "assets/gojo-chibi.png";

let gojoReady = false;
gojo.onload = () => gojoReady = true;
gojo.onerror = () => gojoReady = false;

// Background stars.
const stars = [];

for (let i = 0; i < 85; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.5 + 0.15
    });
}

// ====================================================
// SOUND EFFECTS — GENERATED WITH WEB AUDIO
// No external sound files required.
// ====================================================

let audioContext = null;

function audioReady() {
    if (!game.sound) return false;

    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext || window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        return true;
    } catch (e) {
        return false;
    }
}

function tone(startFreq, endFreq, duration, wave = "sine", volume = 0.07) {
    if (!audioReady()) return;

    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = wave;
    oscillator.frequency.setValueAtTime(startFreq, now);
    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(1, endFreq), now + duration
    );

    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + duration);
}

function soundEffect(type) {
    if (!game.sound) return;

    if (type === "pull") {
        tone(180, 520, 0.22, "sine", 0.055);
    }

    if (type === "push") {
        tone(580, 170, 0.19, "triangle", 0.06);
    }

    if (type === "hit") {
        tone(170, 75, 0.08, "square", 0.035);
    }

    if (type === "portal") {
        tone(420, 760, 0.3, "sine", 0.07);
        setTimeout(() => tone(650, 1050, 0.35, "sine", 0.05), 130);
        setTimeout(() => tone(850, 1350, 0.4, "sine", 0.04), 270);
    }

    if (type === "fail") {
        tone(240, 65, 0.45, "sawtooth", 0.045);
    }

    if (type === "click") {
        tone(500, 720, 0.08, "sine", 0.035);
    }
}

// ====================================================
// LEVEL GENERATOR
// There are no fixed final levels.
// Every completion produces a new random layout.
// ====================================================

function randomBetween(min, max) {
    return min + Math.random() * (max - min);
}

function generateLevel(number) {
    const obstacles = [];

    // More obstacles as the level number increases.
    const count = Math.min(8, Math.floor((number + 1) / 2));

    const startX = 240;
    const availableWidth = 535;
    const slot = count > 0 ? availableWidth / count : 0;

    for (let i = 0; i < count; i++) {
        const width = randomBetween(42, 62);
        const maxHeight = Math.min(155, 55 + number * 5);
        const height = randomBetween(55, maxHeight);

        const x = startX + i * slot + randomBetween(-8, 8);
        const y = FLOOR - height;

        obstacles.push({
            x,
            y,
            baseY: y,
            w: width,
            h: height,
            moving: false,
            phase: Math.random() * Math.PI * 2,
            amp: 0
        });
    }

    // Add a floating moving barrier on some later levels.
    if (number >= 4 && number % 3 === 1) {
        const y = randomBetween(305, 370);

        obstacles.push({
            x: randomBetween(440, 650),
            y,
            baseY: y,
            w: randomBetween(85, 115),
            h: 15,
            moving: true,
            phase: Math.random() * Math.PI * 2,
            amp: 16
        });
    }

    return obstacles;
}

function levelTime(number) {
    return Math.max(42, 80 - number * 1.5);
}

// ====================================================
// SCREENS
// ====================================================

function showScreen(title, description, buttons, extra = "") {
    overlay.classList.remove("hidden");

    overlay.innerHTML = `
        <div class="screen">
            <div class="eyebrow">FLUX // LIMITLESS BLUE</div>
            <h2 style="font-family:Orbitron,sans-serif;letter-spacing:2px;font-size:30px">
                ${title}
            </h2>
            <p class="description">${description}</p>
            ${extra}
            <div class="buttons">${buttons}</div>
        </div>
    `;
}

function hideScreen() {
    overlay.classList.add("hidden");
}

function mainMenu() {
    game.state = "menu";

    showScreen(
        '<span class="hero">FL<span>U</span>X</span>',
        "Control the force. Master the blue. Guide the core.",
        `
            <button class="primary" data-action="start">▶ START GAME</button>
            <button class="secondary" data-action="help">HOW TO PLAY</button>
        `,
        `
            <div class="subtitle">THE LIMITLESS BLUE EXPERIENCE</div>
            <div class="eyebrow">INFINITE LEVELS · MAGNETIC PHYSICS · GOJO</div>
        `
    );
}

function helpScreen() {
    game.state = "help";

    showScreen(
        "HOW TO PLAY",
        "You control a floating blue magnetic field. Guide the energy core through the obstacles and into the portal.",
        `
            <button class="primary" data-action="start">START EXPERIMENT</button>
            <button class="secondary" data-action="menu">BACK</button>
        `,
        `
            <div class="instructions">
                <div class="instruction">
                    <div class="symbol">🖱️</div>
                    <b>MOVE THE FIELD</b>
                    <p>Move your mouse or finger inside the arena.</p>
                </div>
                <div class="instruction">
                    <div class="symbol">✦</div>
                    <b>BLUE PULL</b>
                    <p>Attract the energy core towards the blue field.</p>
                </div>
                <div class="instruction">
                    <div class="symbol">✧</div>
                    <b>BLUE PUSH</b>
                    <p>Push the core away from the magnetic field.</p>
                </div>
            </div>
            <p style="font-size:10px;color:#8ca2bb">
                SPACE: Switch field · R: Restart · ESC: Pause
            </p>
        `
    );
}

function startGame() {
    game.level = 1;
    game.score = 0;
    startLevel();
}

function startLevel() {
    game.state = "playing";
    game.timer = levelTime(game.level);
    game.polarity = 1;
    game.elapsed = 0;

    game.ball = {
        x: 90,
        y: FLOOR - 14,
        vx: 0,
        vy: 0,
        r: 14
    };

    game.pointer = { x: 220, y: 250 };
    game.obstacles = generateLevel(game.level);
    game.particles = [];
    game.trail = [];
    game.collisionCooldown = 0;

    updateHUD();
    updatePolarityButton();
    hideScreen();
    soundEffect("click");
}

function completeLevel() {
    if (game.state !== "playing") return;

    game.state = "complete";

    const bonus = Math.ceil(game.timer * 15);
    const earned = 500 + bonus;

    game.score += earned;
    saveBest();
    updateHUD();
    soundEffect("portal");

    showScreen(
        "LEVEL CLEARED",
        `Experiment ${game.level} completed. A new challenge is waiting.`,
        `
            <button class="primary" data-action="next">NEXT LEVEL →</button>
            <button class="secondary" data-action="menu">MAIN MENU</button>
        `,
        `
            <div class="score-result">+${earned}</div>
            <p style="font-size:10px;color:#8ca2bb">
                TIME BONUS INCLUDED · ENDLESS MODE
            </p>
        `
    );
}

function failLevel() {
    if (game.state !== "playing") return;

    game.state = "failed";
    soundEffect("fail");

    showScreen(
        "FIELD LOST",
        "The experiment timed out. Try a different magnetic strategy.",
        `
            <button class="primary" data-action="restart">↻ TRY AGAIN</button>
            <button class="secondary" data-action="menu">MAIN MENU</button>
        `
    );
}

function pauseGame() {
    if (game.state === "playing") {
        game.state = "paused";

        showScreen(
            "PAUSED",
            "The magnetic field is temporarily suspended.",
            `
                <button class="primary" data-action="resume">RESUME</button>
                <button class="secondary" data-action="restart">RESTART</button>
                <button class="secondary" data-action="menu">MAIN MENU</button>
            `
        );
    } else if (game.state === "paused") {
        game.state = "playing";
        hideScreen();
    }
}

// ====================================================
// BUTTON ACTIONS
// ====================================================

document.addEventListener("click", (event) => {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;

    if (action === "start") startGame();
    if (action === "help") helpScreen();
    if (action === "menu") mainMenu();

    if (action === "next") {
        game.level++;
        startLevel();
    }

    if (action === "resume") {
        game.state = "playing";
        hideScreen();
    }

    if (action === "restart") {
        if (game.state !== "menu" && game.state !== "help") {
            startLevel();
        }
    }

    if (action === "pause") pauseGame();
    if (action === "polarity") togglePolarity();

    if (action === "sound") {
        game.sound = !game.sound;
        updateSoundButton();
        if (game.sound) soundEffect("click");
    }
});

function togglePolarity() {
    if (game.state !== "playing") return;

    game.polarity *= -1;
    updatePolarityButton();

    soundEffect(game.polarity === 1 ? "pull" : "push");
    makeParticles(game.pointer.x, game.pointer.y, 12);
}

function updatePolarityButton() {
    const button = document.getElementById("polarityButton");

    if (game.polarity === 1) {
        button.textContent = "✦ BLUE PULL";
        button.classList.add("active");
    } else {
        button.textContent = "✧ BLUE PUSH";
        button.classList.remove("active");
    }
}

function updateSoundButton() {
    document.getElementById("soundButton").textContent =
        game.sound ? "♫ SOUND ON" : "♫ SOUND OFF";
}

function saveBest() {
    if (game.score > game.best) {
        game.best = game.score;

        try {
            localStorage.setItem("fluxBest", game.best);
        } catch (e) {
            // The game still works if browser storage is blocked.
        }
    }
}

// ====================================================
// INPUT
// ====================================================

function movePointer(event) {
    const rect = canvas.getBoundingClientRect();

    game.pointer.x = Math.max(
        25,
        Math.min(W - 25, (event.clientX - rect.left) * W / rect.width)
    );

    game.pointer.y = Math.max(
        40,
        Math.min(FLOOR - 12, (event.clientY - rect.top) * H / rect.height)
    );
}

canvas.addEventListener("pointermove", movePointer);

canvas.addEventListener("pointerdown", (event) => {
    movePointer(event);

    if (canvas.setPointerCapture) {
        canvas.setPointerCapture(event.pointerId);
    }
});

document.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
        event.preventDefault();
        if (!event.repeat) togglePolarity();
    }

    if (event.key.toLowerCase() === "r") {
        if (game.state !== "menu" && game.state !== "help") {
            startLevel();
        }
    }

    if (event.key === "Escape") {
        pauseGame();
    }
});

// ====================================================
// PARTICLES
// ====================================================

function makeParticles(x, y, amount) {
    for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = randomBetween(40, 160);

        game.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: randomBetween(0.3, 0.8),
            size: randomBetween(1, 3)
        });
    }
}

function updateParticles(dt) {
    for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.life -= dt;

        if (p.life <= 0) {
            game.particles.splice(i, 1);
        }
    }
}

// ====================================================
// COLLISION DETECTION
// Circle versus rectangle collision.
// ====================================================

function collideCircleRect(ball, rect) {
    const closestX = Math.max(
        rect.x, Math.min(ball.x, rect.x + rect.w)
    );

    const closestY = Math.max(
        rect.y, Math.min(ball.y, rect.y + rect.h)
    );

    let dx = ball.x - closestX;
    let dy = ball.y - closestY;
    let distance = Math.hypot(dx, dy);

    if (distance >= ball.r) return false;

    let nx, ny;

    if (distance < 0.001) {
        // The ball centre is inside the obstacle.
        const edges = [
            { d: Math.abs(ball.x - rect.x), nx: -1, ny: 0 },
            { d: Math.abs(rect.x + rect.w - ball.x), nx: 1, ny: 0 },
            { d: Math.abs(ball.y - rect.y), nx: 0, ny: -1 },
            { d: Math.abs(rect.y + rect.h - ball.y), nx: 0, ny: 1 }
        ];

        edges.sort((a, b) => a.d - b.d);

        nx = edges[0].nx;
        ny = edges[0].ny;

        if (nx === -1) ball.x = rect.x - ball.r;
        if (nx === 1) ball.x = rect.x + rect.w + ball.r;
        if (ny === -1) ball.y = rect.y - ball.r;
        if (ny === 1) ball.y = rect.y + rect.h + ball.r;

        distance = ball.r;
    } else {
        nx = dx / distance;
        ny = dy / distance;

        const overlap = ball.r - distance;

        ball.x += nx * (overlap + 0.2);
        ball.y += ny * (overlap + 0.2);
    }

    // Bounce only when approaching the obstacle.
    const velocity = ball.vx * nx + ball.vy * ny;

    if (velocity < 0) {
        ball.vx -= 1.4 * velocity * nx;
        ball.vy -= 1.4 * velocity * ny;
    }

    return true;
}

// ====================================================
// PHYSICS ENGINE
// Gravity + magnetic acceleration + collisions.
// ====================================================

const GRAVITY = 570;
const MAGNET_RANGE = 280;
const MAGNET_STRENGTH = 1450;
const MAX_SPEED = 520;

function updatePhysics(dt) {
    const ball = game.ball;

    // Animate moving barriers.
    for (const o of game.obstacles) {
        if (o.moving) {
            o.y = o.baseY +
                Math.sin(game.elapsed * 1.6 + o.phase) * o.amp;
        }
    }

    // Small substeps improve collision stability.
    const steps = 3;
    const step = dt / steps;

    for (let s = 0; s < steps; s++) {
        let ax = 0;
        let ay = GRAVITY;

        const dx = game.pointer.x - ball.x;
        const dy = game.pointer.y - ball.y;
        const distance = Math.hypot(dx, dy);

        // Apply a magnetic force when inside the field range.
        if (distance < MAGNET_RANGE && distance > 1) {
            const falloff = 1 - distance / MAGNET_RANGE;
            const force = MAGNET_STRENGTH * falloff * falloff;

            ax += (dx / distance) * force * game.polarity;
            ay += (dy / distance) * force * game.polarity;
        }

        ball.vx += ax * step;
        ball.vy += ay * step;

        // Keep velocity within a safe limit.
        const speed = Math.hypot(ball.vx, ball.vy);

        if (speed > MAX_SPEED) {
            ball.vx = ball.vx / speed * MAX_SPEED;
            ball.vy = ball.vy / speed * MAX_SPEED;
        }

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        // Arena boundaries.
        if (ball.x - ball.r < 34) {
            ball.x = 34 + ball.r;
            ball.vx = Math.abs(ball.vx) * 0.55;
        }

        if (ball.x + ball.r > W - 34) {
            ball.x = W - 34 - ball.r;
            ball.vx = -Math.abs(ball.vx) * 0.55;
        }

        if (ball.y - ball.r < 35) {
            ball.y = 35 + ball.r;
            ball.vy = Math.abs(ball.vy) * 0.5;
        }

        // Floor collision.
        if (ball.y + ball.r > FLOOR) {
            ball.y = FLOOR - ball.r;

            if (ball.vy > 0) {
                ball.vy = -ball.vy * 0.25;
            }

            if (Math.abs(ball.vy) < 25) {
                ball.vy = 0;
            }

            ball.vx *= Math.pow(0.78, step);
        }

        // Obstacle collisions.
        for (const obstacle of game.obstacles) {
            const hit = collideCircleRect(ball, obstacle);

            if (hit && game.collisionCooldown <= 0) {
                soundEffect("hit");
                makeParticles(ball.x, ball.y, 5);
                game.collisionCooldown = 0.15;
            }
        }
    }

    // Air friction.
    ball.vx *= Math.pow(0.995, dt * 60);
    ball.vy *= Math.pow(0.999, dt * 60);

    game.collisionCooldown -= dt;

    // Trail behind the moving energy core.
    game.trail.push({ x: ball.x, y: ball.y });

    if (game.trail.length > 15) {
        game.trail.shift();
    }

    // Portal check.
    const portalDistance = Math.hypot(
        ball.x - PORTAL.x,
        ball.y - PORTAL.y
    );

    if (portalDistance < 34) {
        completeLevel();
    }
}

// ====================================================
// DRAWING
// ====================================================

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#0d2035");
    gradient.addColorStop(1, "#07111e");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Stars.
    for (const star of stars) {
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = "#d5f4ff";

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;

    // Grid.
    ctx.strokeStyle = "#29496630";
    ctx.lineWidth = 1;

    for (let x = 30; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 35);
        ctx.lineTo(x, FLOOR);
        ctx.stroke();
    }

    for (let y = 50; y < FLOOR; y += 40) {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(W - 30, y);
        ctx.stroke();
    }

    // Floor.
    const floorGradient = ctx.createLinearGradient(0, FLOOR, 0, H);
    floorGradient.addColorStop(0, "#203c57");
    floorGradient.addColorStop(1, "#101c2c");

    ctx.fillStyle = floorGradient;
    ctx.fillRect(30, FLOOR, W - 60, H - FLOOR);

    ctx.strokeStyle = "#55dfff80";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, FLOOR);
    ctx.lineTo(W - 30, FLOOR);
    ctx.stroke();

    // Arena border.
    ctx.strokeStyle = "#31516e";
    ctx.lineWidth = 2;
    ctx.strokeRect(30, 35, W - 60, FLOOR - 35);
}

function drawObstacles() {
    for (const o of game.obstacles) {
        ctx.save();

        ctx.shadowColor = o.moving ? "#8c7cff" : "#55dfff";
        ctx.shadowBlur = 12;

        const gradient = ctx.createLinearGradient(
            o.x, o.y, o.x + o.w, o.y + o.h
        );

        gradient.addColorStop(0, "#38536c");
        gradient.addColorStop(1, "#14273b");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(o.x, o.y, o.w, o.h, 5);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 2;
        ctx.strokeStyle = o.moving ? "#b6a2ff" : "#55dfff";
        ctx.stroke();

        ctx.strokeStyle = "#ffffff25";
        ctx.lineWidth = 1;

        for (let y = o.y + 12; y < o.y + o.h; y += 17) {
            ctx.beginPath();
            ctx.moveTo(o.x + 6, y);
            ctx.lineTo(o.x + o.w - 6, y);
            ctx.stroke();
        }

        ctx.restore();
    }
}

// Draws the blue energy orb.
function drawBlueOrb(x, y, radius, time) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    const pulse = 1 + Math.sin(time * 0.004) * 0.08;

    ctx.shadowColor = "#168bff";
    ctx.shadowBlur = 28;

    const gradient = ctx.createRadialGradient(
        x - radius * 0.3,
        y - radius * 0.35,
        1,
        x,
        y,
        radius * pulse
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.22, "#c8f4ff");
    gradient.addColorStop(0.55, "#49baff");
    gradient.addColorStop(1, "#0872db");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, radius * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#d8f9ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

// Gojo mascot.
// If the image is missing, a simple fallback mascot is drawn.
function drawFallbackGojo(x, y, time) {
    ctx.save();
    ctx.translate(x, y);

    const bob = Math.sin(time * 0.002) * 4;
    ctx.translate(0, bob);

    // Body.
    ctx.fillStyle = "#101a2a";
    ctx.beginPath();
    ctx.roundRect(-23, 45, 46, 65, 10);
    ctx.fill();

    ctx.strokeStyle = "#49617c";
    ctx.stroke();

    // Raised arms.
    ctx.strokeStyle = "#f1c5ae";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(-18, 56);
    ctx.lineTo(-35, 22);
    ctx.lineTo(-40, 10);
    ctx.moveTo(18, 56);
    ctx.lineTo(36, 22);
    ctx.lineTo(43, 8);
    ctx.stroke();

    // Face.
    ctx.fillStyle = "#f4cbb8";
    ctx.beginPath();
    ctx.ellipse(0, 22, 32, 37, 0, 0, Math.PI * 2);
    ctx.fill();

    // White hair.
    ctx.fillStyle = "#f4f8ff";
    ctx.beginPath();
    ctx.arc(0, 5, 35, Math.PI, Math.PI * 2);
    ctx.lineTo(28, 10);
    ctx.lineTo(18, 4);
    ctx.lineTo(10, 14);
    ctx.lineTo(0, 3);
    ctx.lineTo(-11, 15);
    ctx.lineTo(-25, 5);
    ctx.lineTo(-31, 19);
    ctx.closePath();
    ctx.fill();

    // Blindfold.
    ctx.fillStyle = "#111722";
    ctx.fillRect(-30, 12, 60, 15);

    // Coat collar.
    ctx.fillStyle = "#d9e8f5";
    ctx.beginPath();
    ctx.moveTo(-10, 48);
    ctx.lineTo(0, 62);
    ctx.lineTo(11, 48);
    ctx.closePath();
    ctx.fill();

    // Tiny shoes.
    ctx.fillStyle = "#090e18";
    ctx.fillRect(-21, 105, 15, 10);
    ctx.fillRect(7, 105, 15, 10);

    ctx.restore();
}

function drawGojo(time) {
    const bob = Math.sin(time * 0.002) * 5;
    const x = 785;
    const y = 105 + bob;
    const w = 112;
    const h = 142;

    if (gojoReady) {
        ctx.save();
        ctx.globalAlpha = 0.96;
        ctx.drawImage(gojo, x, y, w, h);
        ctx.restore();
    } else {
        drawFallbackGojo(x + w / 2, y + 28, time);
    }

    // Blue orb appears just over his raised hand.
    // Move these coordinates slightly if you replace the image.
    const orbX = x + w * 0.87;
    const orbY = y + h * 0.34;

    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = "#62dfff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(orbX, orbY, 23 + Math.sin(time * 0.004) * 3,
            0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    drawBlueOrb(orbX, orbY, 10, time);

    ctx.fillStyle = "#9deaff";
    ctx.font = "bold 9px Inter";
    ctx.textAlign = "center";
    ctx.fillText("LIMITLESS", x + 57, y + h + 8);
}

function drawPortal(time) {
    ctx.save();
    ctx.translate(PORTAL.x, PORTAL.y);
    ctx.rotate(time * 0.0006);

    ctx.shadowColor = "#55dfff";
    ctx.shadowBlur = 25;

    ctx.strokeStyle = "#55dfff";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, 31, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 8;
    ctx.strokeStyle = "#d4faff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 21, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#146aab";
    ctx.beginPath();
    ctx.arc(0, 0, 17, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#a9f0ff";
    ctx.font = "bold 10px Inter";
    ctx.textAlign = "center";
    ctx.fillText("EXIT", PORTAL.x, PORTAL.y + 52);
}

function drawCore() {
    const ball = game.ball;

    // Trail.
    for (let i = 0; i < game.trail.length; i++) {
        const p = game.trail[i];

        ctx.globalAlpha = (i + 1) / game.trail.length * 0.22;
        ctx.fillStyle = "#5cddff";
        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            ball.r * 0.6 * (i + 1) / game.trail.length,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;

    ctx.save();
    ctx.shadowColor = "#55dfff";
    ctx.shadowBlur = 24;

    const gradient = ctx.createRadialGradient(
        ball.x - 5, ball.y - 5, 2,
        ball.x, ball.y, ball.r + 4
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.35, "#b6f4ff");
    gradient.addColorStop(0.7, "#45b6ed");
    gradient.addColorStop(1, "#124d86");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#d5faff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

function drawField() {
    const m = game.pointer;

    ctx.save();
    ctx.globalAlpha = 0.23;
    ctx.strokeStyle = "#55dfff";
    ctx.lineWidth = 1.5;

    for (let radius = 27; radius <= 74; radius += 23) {
        ctx.beginPath();
        ctx.arc(m.x, m.y, radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();

    drawBlueOrb(m.x, m.y, 13, performance.now());

    ctx.fillStyle = "#d8faff";
    ctx.font = "bold 9px Inter";
    ctx.textAlign = "center";
    ctx.fillText(
        game.polarity === 1 ? "PULL" : "PUSH",
        m.x,
        m.y + 29
    );
}

function drawParticles() {
    for (const p of game.particles) {
        ctx.globalAlpha = Math.max(0, p.life / 0.8);
        ctx.fillStyle = "#8beaff";

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

function render(time) {
    drawBackground();
    drawPortal(time);
    drawObstacles();
    drawCore();
    drawGojo(time);
    drawField();
    drawParticles();

    ctx.textAlign = "left";
    ctx.fillStyle = "#6ddfff";
    ctx.font = "bold 10px Inter";
    ctx.fillText("EXPERIMENT " + String(game.level).padStart(2, "0"), 49, 59);

    ctx.fillStyle = "#d9edff";
    ctx.font = "bold 18px Orbitron";
    ctx.fillText("LIMITLESS BLUE", 49, 83);
}

// ====================================================
// HUD
// ====================================================

function updateHUD() {
    document.getElementById("level").textContent =
        String(game.level).padStart(2, "0");

    document.getElementById("time").textContent =
        Math.max(0, Math.ceil(game.timer));

    document.getElementById("score").textContent =
        String(game.score).padStart(4, "0");

    document.getElementById("best").textContent =
        String(game.best).padStart(4, "0");

    const hint = game.level < 3
        ? "Learn to control the blue field and guide the core."
        : game.level < 7
        ? "More barriers ahead. Plan your magnetic movement."
        : "Advanced experiment. Watch your timing and field position.";

    document.getElementById("hint").innerHTML =
        `<b>LEVEL ${game.level}:</b> ${hint}`;
}

// ====================================================
// MAIN LOOP
// ====================================================

function gameLoop(timestamp) {
    const dt = Math.min(
        (timestamp - game.lastFrame) / 1000 || 0,
        0.03
    );

    game.lastFrame = timestamp;

    if (game.state === "playing") {
        game.elapsed += dt;
        game.timer -= dt;

        if (game.timer <= 0) {
            game.timer = 0;
            updateHUD();
            failLevel();
        } else {
            updatePhysics(dt);
            updateParticles(dt);
            updateHUD();
        }
    } else if (game.state !== "paused") {
        updateParticles(dt);
    }

    render(timestamp);
    requestAnimationFrame(gameLoop);
}

// ====================================================
// INITIALIZE
// ====================================================

updateHUD();
updatePolarityButton();
updateSoundButton();
mainMenu();

requestAnimationFrame(gameLoop);

</script>
